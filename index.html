<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Power Atlas — Prototype</title>
  <meta name="description" content="Evidence-first, time-aware network map of public power relationships." />
  <script src="https://unpkg.com/cytoscape@3.30.3/dist/cytoscape.min.js"></script>
  <style>
    :root{color-scheme:light;--bg:#f7f8fa;--panel:#ffffff;--ink:#15181d;--muted:#6d7480;--line:#dfe3e8;--accent:#243b67;--accent2:#edf2fb;--shadow:0 14px 36px rgba(23,33,52,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.topbar{position:relative;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px 12px}.brand-row{display:flex;align-items:center;gap:10px}.brand{font-weight:800;letter-spacing:-.02em;font-size:18px;white-space:nowrap}.beta{font-size:10px;font-weight:700;padding:3px 6px;border-radius:999px;background:#eef1f6;color:#626b78}.search-wrap{margin-left:auto;position:relative;flex:1;max-width:540px}.search-wrap input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbfc;outline:none}.search-wrap input:focus{border-color:#9eb0ce;box-shadow:0 0 0 3px #eaf0fa}.controls{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-top:9px;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.filter-chip{border:1px solid var(--line);background:#fff;color:#6e7580;padding:7px 10px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px}.filter-chip.active{color:var(--ink);border-color:#b9c3d1;background:#f9fbfe}.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid}.fit{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;white-space:nowrap}.workspace{position:relative;min-height:0}#graph{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff 0,#f7f8fa 55%,#f1f3f6 100%)}.timeline-card{position:absolute;z-index:4;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;max-width:720px;margin:auto}.year-now{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}.range-wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:10px;color:var(--muted)}.range-wrap input{width:100%;accent-color:#435d8f}.evidence-key{font-size:10px;color:var(--muted);white-space:nowrap}.drawer{position:absolute;z-index:10;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(20,27,39,.12);transform:translateX(102%);transition:transform .2s ease;display:grid;grid-template-rows:auto 1fr}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:flex-end;padding:9px;border-bottom:1px solid var(--line)}.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1}#drawerBody{overflow:auto;padding:18px 18px 96px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800;color:#7a8390;margin-bottom:7px}h2{font-size:24px;line-height:1.08;letter-spacing:-.025em;margin:0 0 7px}p{font-size:14px;line-height:1.55;color:#3f4651}.muted{color:var(--muted);font-size:13px}.section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 9px;color:#68717e}.relation-list,.source-list{display:grid;gap:8px}.relation-row{display:grid;text-align:left;gap:3px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px}.relation-row:hover{background:#fafbfc}.relation-row span{font-weight:700}.relation-row small{color:var(--muted)}.relationship-callout{display:inline-block;background:var(--accent2);color:var(--accent);font-weight:750;border-radius:9px;padding:8px 10px;margin:7px 0 11px}.meta-grid{display:grid;grid-template-columns:1fr;gap:7px;margin:12px 0}.meta-grid div{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:2px}.meta-grid span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.meta-grid strong{font-size:13px}.source-link{display:flex;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:13px}.source-link:hover{background:#f8fafc}.notice{margin-top:18px;border-left:3px solid #aab4c4;background:#f5f7fa;padding:10px 11px;border-radius:0 8px 8px 0;color:#59616c;font-size:12px;line-height:1.45}.load-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#7b3131;padding:24px}.intro-badge{position:absolute;left:12px;top:12px;z-index:3;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(28,36,50,.07);padding:9px 10px;max-width:270px;font-size:11px;color:#5d6570;line-height:1.4;pointer-events:none}.intro-badge strong{display:block;color:#282e36;font-size:12px;margin-bottom:2px}@media (max-width:720px){.brand-row{flex-wrap:wrap}.search-wrap{order:3;flex-basis:100%;max-width:none}.controls{padding-top:8px}.fit{margin-left:0}.timeline-card{grid-template-columns:1fr;gap:6px;padding:9px 10px}.year-now{text-align:left}.evidence-key{display:none}.drawer{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(102%);border-radius:18px 18px 0 0}.drawer.open{transform:translateY(0)}.intro-badge{max-width:220px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-row"><div class="brand">Power Atlas</div><div class="beta">PROTOTYPE</div><div class="search-wrap"><input id="search" type="search" placeholder="Search people and institutions…" aria-label="Search graph" /></div></div>
      <div class="controls"><div id="typeFilters" style="display:flex;gap:7px"></div><button id="fitGraph" class="fit">Fit graph</button></div>
    </header>
    <section class="workspace">
      <div id="graph"></div>
      <div class="intro-badge"><strong>Tap any node or relationship.</strong>Every edge should eventually be sourced, dated, and evidence-graded.</div>
      <div class="timeline-card" aria-label="Timeline controls"><div class="year-now" id="yearValue">1910</div><div class="range-wrap"><span id="yearMin"></span><input id="yearSlider" type="range" /><span id="yearMax"></span></div><div class="evidence-key">A primary · B strong · C supported · D inference</div></div>
      <aside class="drawer" id="drawer" aria-live="polite"><div class="drawer-head"><button id="closeDrawer" class="close" aria-label="Close details">×</button></div><div id="drawerBody"></div></aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
